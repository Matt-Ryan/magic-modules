---
name: 'SemanticGovernancePolicyEngine'
description: |
  A SemanticGovernancePolicyEngine (SGPE) is a project-level singleton that
  manages semantic governance policies for Vertex AI workloads in a region.
  It provisions a managed PSC (Private Service Connect) endpoint and
  associated networking infrastructure that downstream Vertex AI resources
  can reference for policy enforcement.

  Each project has at most one SGPE per region. The resource follows the
  AIP-156 singleton pattern: a Get against an uninitialized or deprovisioned
  engine returns the singleton with state INACTIVE rather than HTTP 404.
references:
  guides:
    # TODO: replace with the published SGPE docs URL once it is public.
    'Official Documentation': 'https://cloud.google.com/vertex-ai/docs'
  api: 'https://cloud.google.com/vertex-ai/docs/reference/rest/v1beta1/projects.locations.semanticGovernancePolicyEngine'
docs:
min_version: 'beta'
id_format: 'projects/{{project}}/locations/{{region}}/semanticGovernancePolicyEngine'
base_url: 'projects/{{project}}/locations/{{region}}/semanticGovernancePolicyEngine'
self_link: 'projects/{{project}}/locations/{{region}}/semanticGovernancePolicyEngine'
create_url: 'projects/{{project}}/locations/{{region}}/semanticGovernancePolicyEngine'
# Singleton resource: AIP-156 prescribes upsert via PATCH with no parent
# Create RPC. Delete is handled by a custom :deprovision RPC.
create_verb: 'PATCH'
update_url: 'projects/{{project}}/locations/{{region}}/semanticGovernancePolicyEngine'
update_verb: 'PATCH'
import_format:
  - 'projects/{{project}}/locations/{{region}}/semanticGovernancePolicyEngine'
# Singleton has no standard Delete RPC per AIP-156; deletion is handled
# entirely by the custom_delete template via :deprovision (see
# custom_code.custom_delete below). We deliberately do NOT set
# exclude_delete: true — that flag suppresses the entire delete handler
# (no custom_delete is emitted either) and replaces it with a "cannot be
# deleted" warning, which is wrong for SGPE.
# update_mask is left at the magic-modules default (true) so the generator
# emits a properly-scoped update_mask from the schema diff.
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  actions: ['create', 'update']
  type: 'OpAsync'
  operation:
    base_url: '{{op_id}}'
  result:
    resource_inside_response: true
custom_code:
  constants: 'templates/terraform/constants/semantic_governance_policy_engine.go.tmpl'
  post_read: 'templates/terraform/post_read/vertex_ai_semantic_governance_policy_engine.go.tmpl'
  custom_delete: 'templates/terraform/custom_delete/sgpe_deprovision.go.tmpl'
custom_diff:
  - 'sgpeCustomizeDiff'
examples:
  - name: 'vertex_ai_semantic_governance_policy_engine_basic'
    primary_resource_id: 'sgpe'
    # exclude_test: true until SGPE backend visibility is wide enough for
    # HashiCorp CI to run acceptance tests against a real project.
    exclude_test: true
  - name: 'vertex_ai_semantic_governance_policy_engine_full'
    primary_resource_id: 'sgpe'
    exclude_test: true
  - name: 'vertex_ai_semantic_governance_policy_engine_multi_gateway'
    primary_resource_id: 'sgpe'
    exclude_test: true
parameters:
  - name: 'region'
    type: String
    description: |
      The region of the SemanticGovernancePolicyEngine, e.g. 'us-central1'.
    url_param_only: true
    immutable: true
    default_from_api: true
properties:
  - name: 'targetProject'
    type: String
    description: |
      Optional. The project that the SGPE governs. If unset, the SGPE
      governs the project it is created in.
  - name: 'gatewayConfig'
    api_name: 'gatewayConfigs'
    type: Map
    description: |
      Configurations for gateways. The map is keyed by a user-defined
      `name` per block. Renaming a block forces re-creation of the
      gateway (the synthetic `name` field is ForceNew).
    key_name: 'name'
    value_type:
      type: NestedObject
      properties:
        - name: 'network'
          type: String
          description: |
            The fully-qualified network URI for this gateway, e.g.
            `projects/{project}/global/networks/{network}`.
        - name: 'subnetwork'
          type: String
          description: |
            The fully-qualified subnetwork URI for this gateway, e.g.
            `projects/{project}/regions/{region}/subnetworks/{subnetwork}`.
        - name: 'dnsZoneName'
          type: String
          description: |
            The DNS zone name for this gateway's PSC endpoint.
        - name: 'state'
          type: String
          description: |
            The current state of this gateway. One of:
            STATE_UNSPECIFIED, PROVISIONING, ACTIVE, FAILED,
            DEPROVISIONING, INACTIVE.
          output: true
        - name: 'ipAddress'
          type: String
          description: |
            The IP address allocated for this gateway's PSC endpoint.
          output: true
        - name: 'pscEndpoint'
          type: String
          description: |
            The PSC endpoint URI for this gateway.
          output: true
        - name: 'dnsRecord'
          type: String
          description: |
            The DNS record for this gateway's PSC endpoint.
          output: true
  - name: 'name'
    type: String
    description: |
      The resource name of the SemanticGovernancePolicyEngine, in the form
      'projects/{project}/locations/{region}/semanticGovernancePolicyEngine'.
    output: true
  - name: 'createTime'
    type: String
    description: |
      The time the SemanticGovernancePolicyEngine was created, in RFC3339
      UTC "Zulu" format.
    output: true
  - name: 'updateTime'
    type: String
    description: |
      The time the SemanticGovernancePolicyEngine was last updated, in
      RFC3339 UTC "Zulu" format.
    output: true
  - name: 'pscServiceAttachment'
    type: String
    description: |
      The Private Service Connect service attachment URI for the SGPE's
      managed endpoint.
    output: true
  - name: 'ipAddress'
    type: String
    description: |
      The IP address allocated for the SGPE's managed PSC endpoint.
    output: true
  - name: 'pscForwardingRule'
    type: String
    description: |
      The Private Service Connect forwarding rule URI for the SGPE's
      managed endpoint.
    output: true
  - name: 'state'
    type: String
    description: |
      The current state of the SemanticGovernancePolicyEngine. One of:
      STATE_UNSPECIFIED, PROVISIONING, ACTIVE, FAILED, DEPROVISIONING,
      INACTIVE.
    output: true
